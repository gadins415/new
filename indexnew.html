<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강펫택시</title>

<style>
body {
  margin:0;
  font-family:-apple-system;
  background: url('bg.png') no-repeat center top;
  background-size:cover;
}

/* 전체 */
.container {
  position:relative;
  height:100dvh; /* 🔥 핵심: 모바일 대응 */
  max-width:420px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

/* 상단 */
.header {
  text-align:center;
  padding:16px 10px 4px;
  color:#000080;
}

.header h1 {
  font-size:18px;
  margin:5px 0;
}

.header p {
  font-size:12px;
  opacity:0.7;
}

/* 아이폰 */
/* 아이폰 외곽 */
.phone {
  position:absolute;
  top:180px;   /* 420 × 0.43 */
  left:50%;
  transform:translateX(-50%);
  width:280px;
  max-width:320px;

  aspect-ratio: 9 / 19; /* 🔥 핵심: 아이폰 비율 */
  
  background:#000080;
  border-radius:40px;
  padding:10px;
  position:relative;
}

/* 내부 화면 */
.screen {
  width:100%;
  height:100%;
  background:#fffacd;
  border-radius:30px;
  padding:16px;

  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:10px;
}

/* 텍스트 */
.row {
  font-size:13px;
  margin-bottom:5px;
  color:#000080;
}

.price {
  font-size:20px;
  font-weight:800;
  margin:10px 0;
  color:#000080;
}

/* CTA */
.cta {
  background:#ffc300;
  margin-top:auto;
  padding:12px;
  border-radius:12px;
  text-align:center;
  font-weight:700;
}

/* 신뢰 */
.trust {
  text-align:center;
  font-size:12px;
  color:#000080;
  margin-top:4px;
}

/* 후기 */
.review {
  font-size:11px;
  text-align:center;
  color:#000080;
  margin-top:2px;
}

/* 하단 고정 */
.footer {
  padding:8px;
}

/* 버튼 */
.buttons {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.btn {
  padding:10px;
  border-radius:10px;
  text-align:center;
  font-size:12px;
  font-weight:600;
}

/* 스타일 */
.store {
  background:#000080;
  color:#fff;
}

.kakao {
  background:#fee500;
  color:#000;
}

/* 이미지 레이어 */
.visual-wrap {
  position:relative;
}

/* 강아지 (왼쪽) */
.dog {
  position:absolute;
  left:50px;   /* 120 × 0.43 */
  top:280px;   /* 650 × 0.43 */
  width:80px;
  z-index:2;
}

/* 춘식이 (오른쪽) */
.chunsik {
  position:absolute;
  right:50px;
  top:280px;
  width:90px;
  z-index:2;
}

/* 로고 */
.logo {
  position:absolute;
  top:52px;     /* 120 × 0.43 */
  left:50%;
  transform:translateX(-50%);
  width:90px;
}


</style>
</head>

<body>

<div class="container">

  <!-- ======================
       1. 헤드 영역
  ====================== -->
  <div>

    <div class="header">
    
      <img src="driverlogo.png" class="logo">
      
      <h1>견주 없이도 안전한 펫 이동</h1>
      <p>단독 이동 · 실시간 케어</p>
    </div>

    <!-- ======================
         2. 아이폰 UI 블럭
         👉 나중에 데이터 연결 가능
    ====================== -->
<div class="visual-wrap">

  <img src="csheadphone.png" class="dog">
  <img src="chunsic.png" class="chunsik">
  
    <div class="phone">
      <div class="screen">

        <!-- 출발/도착 -->
        <div class="row">
          수원 → 분당
        </div>

        <!-- 시간 -->
        <div class="row">
          오늘 14:00
        </div>

        <!-- 가격 (JS 연결 예정) -->
        <div class="price" id="price">
          32,500원
        </div>

        <!-- CTA 버튼 -->
        <div class="cta" id="mainCTA">
          요금 확인하고 예약하기 →
        </div>

      </div>
    </div>
</div>

    <!-- ======================
         3. 신뢰 문구
    ====================== -->
    <div class="trust">
      ✔ 기사 직접 배차 · 단독 이동
    </div>

    <!-- ======================
         4. 후기 (나중에 자동 스크롤)
    ====================== -->
    <div class="review">
      🐶 "혼자 이동인데도 안심됐어요"
    </div>

  </div>

  <!-- ======================
       5. 하단 버튼 (핵심 CTA)
       👉 여기에 링크 연결
  ====================== -->
  <div class="footer">

    <div class="buttons">

      <!-- 플레이스토어 -->
      <div class="btn store" id="playBtn">
        플레이스토어
      </div>

      <!-- 앱스토어 -->
      <div class="btn store" id="appBtn">
        앱스토어
      </div>

      <!-- 카카오 견주 -->
      <div class="btn kakao" id="kakaoUser">
        견주 상담
      </div>

      <!-- 카카오 기사 -->
      <div class="btn kakao" id="kakaoDriver">
        기사 지원
      </div>

    </div>

  </div>

</div>

<!-- ======================
     6. 기능 영역 (JS)
     👉 여기만 수정하면 됨
====================== -->

/* 메인 CTA */

</script>

</body>
</html>
