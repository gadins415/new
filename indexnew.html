<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강펫택시</title>

<style>
body {
  margin:0;
  font-family:-apple-system;
  background:#fffacd;
}

/* 전체 */
.container {
  height:100vh;
  max-width:420px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

/* 상단 */
.header {
  text-align:center;
  padding:20px 10px 5px;
  color:#000080;
}

.header h1 {
  font-size:20px;
  margin:5px 0;
}

.header p {
  font-size:13px;
  opacity:0.7;
}

/* 아이폰 */
.phone {
  margin:10px;
  background:#000080;
  border-radius:40px;
  padding:10px;
}

.screen {
  background:#fffacd;
  border-radius:30px;
  padding:16px;
}

/* 내용 */
.row {
  font-size:14px;
  margin-bottom:6px;
  color:#000080;
}

.price {
  font-size:22px;
  font-weight:800;
  margin:12px 0;
  color:#000080;
}

.cta {
  background:#ffc300;
  padding:14px;
  border-radius:14px;
  text-align:center;
  font-weight:700;
}

/* 신뢰 */
.trust {
  text-align:center;
  font-size:13px;
  color:#000080;
  margin-top:6px;
}

/* 후기 */
.review {
  font-size:12px;
  text-align:center;
  color:#000080;
  margin-top:4px;
}

/* 하단 */
.footer {
  padding:10px;
}

/* 버튼 */
.buttons {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.btn {
  padding:12px;
  border-radius:12px;
  text-align:center;
  font-size:13px;
  font-weight:600;
}

/* 버튼 스타일 */
.store {
  background:#000080;
  color:#fff;
}

.kakao {
  background:#fee500;
  color:#000;
}

</style>
</head>

<body>

<div class="container">

  <!-- 상단 -->
  <div>
    <div class="header">
      <h1>견주 없이도 안전한 펫 이동</h1>
      <p>단독 이동 · 실시간 케어</p>
    </div>

    <!-- 아이폰 -->
    <div class="phone">
      <div class="screen">

        <div class="row">수원 → 분당</div>
        <div class="row">오늘 14:00</div>

        <div class="price">32,500원</div>

        <div class="cta">
          요금 확인하고 예약하기 →
        </div>

      </div>
    </div>

    <div class="trust">
      ✔ 기사 직접 배차 · 단독 이동
    </div>

    <div class="review">
      🐶 "혼자 이동인데도 안심됐어요"
    </div>

  </div>

  <!-- 하단 버튼 -->
  <div class="footer">
    <div class="buttons">

      <div class="btn store">플레이스토어</div>
      <div class="btn store">앱스토어</div>

      <div class="btn kakao">견주 상담</div>
      <div class="btn kakao">기사 지원</div>

    </div>
  </div>

</div>

</body>
</html>
